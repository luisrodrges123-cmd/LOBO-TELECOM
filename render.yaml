services:
  - type: web
    name: lobo-telecom
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_USER
        value: Angelito
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: lobo-telecom-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

databases:
  - name: lobo-telecom-db
    databaseName: lobo_telecom
    user: lobo_telecom
    plan: 0.1c-256mb
    diskSizeGB: 1
    region: oregon
